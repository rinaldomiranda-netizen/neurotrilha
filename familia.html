<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14304F">
<title>NeuroTrilha — Devolutiva da avaliação</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='96' height='96' rx='26' fill='%232563A8'/%3E%3Ccircle cx='22' cy='74' r='4' fill='%23fff' opacity='.55'/%3E%3Ccircle cx='34' cy='66' r='5' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='44' cy='55' r='6' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='50' cy='42' r='7' fill='%23fff'/%3E%3Cpath d='M72 14 L76.7 24.2 L87.8 25.4 L79.5 32.9 L81.8 43.8 L72 38.2 L62.2 43.8 L64.5 32.9 L56.2 25.4 L67.3 24.2 Z' fill='%23F6C453'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:18px/1.6 "Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif;color:#172438;background:#F4F7FB;min-height:100vh}
.topo{background:#14304F;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
.topo i{width:38px;height:38px;display:block;font-style:normal}.topo i svg{width:100%;height:100%;display:block}.topo b{font-family:Nunito,sans-serif;font-weight:900;font-size:18px}
main{max-width:780px;margin:auto;padding:18px}
.cartao{background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(20,48,79,.08);padding:22px 24px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;color:#0f6f64;margin:0 0 6px}.muted{color:#5d6f86;font-size:15px}
ul{margin:6px 0 0;padding-left:22px}li{margin:4px 0}
.imprimir{border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:700;color:#fff;background:#2563A8;cursor:pointer}
.aviso{font-size:14px;color:#5d6f86;text-align:center;margin:18px 0}
@media print{.topo,.imprimir{display:none}body{background:#fff}.cartao{box-shadow:none;border:1px solid #dde5ef}}
</style>
</head>
<body>
<div class="topo"><i><svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="26" fill="#2563A8"/><circle cx="22" cy="74" r="4" fill="#fff" opacity=".55"/><circle cx="34" cy="66" r="5" fill="#fff" opacity=".7"/><circle cx="44" cy="55" r="6" fill="#fff" opacity=".85"/><circle cx="50" cy="42" r="7" fill="#fff"/><path d="M72 14 L76.7 24.2 L87.8 25.4 L79.5 32.9 L81.8 43.8 L72 38.2 L62.2 43.8 L64.5 32.9 L56.2 25.4 L67.3 24.2 Z" fill="#F6C453"/></svg></i><div><b>NeuroTrilha</b><br><small>Devolutiva da avaliação</small></div></div>
<main id="principal"><div class="cartao">Carregando…</div></main>
<script src="config.js" onerror="this.remove()"></script>
<script>
"use strict";
// Página que a família recebe pelo WhatsApp: só a devolutiva em linguagem simples (sem QI nem respostas).
const API = (window.NT_CONFIG && window.NT_CONFIG.FUNCOES) || "";
const TOKEN = (new URLSearchParams(location.search).get("d") || "").replace(/[^A-Za-z0-9_-]/g, "");
const TITULOS = [["abertura", "Para começar"], ["fortes", "O que foi bem"], ["atencao", "O que precisa de mais apoio"], ["casa", "Ideias para casa"], ["escola", "Ideias para a escola"], ["encaminhamentos", "Próximos passos"], ["fechamento", "Para terminar"]];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function bloco(t) { const l = String(t || "").split("\n").map((x) => x.trim()).filter(Boolean); return l.length && l.every((x) => /^- /.test(x)) ? "<ul>" + l.map((x) => "<li>" + esc(x.slice(2)) + "</li>").join("") + "</ul>" : l.map((x) => "<p>" + esc(x) + "</p>").join(""); }
async function carregar() {
  try {
    const r = await fetch(API + "/api/familia/" + TOKEN, { cache: "no-store" }), d = await r.json();
    if (!r.ok) throw new Error(d.error || "Link inválido.");
    document.getElementById("principal").innerHTML =
      '<div class="cartao"><h1>Devolutiva da avaliação' + (d.nome ? " de " + esc(d.nome) : "") + '</h1><p class="muted">Avaliação feita em ' + new Date(d.data).toLocaleDateString("pt-BR") + (d.profissional ? " · " + esc(d.profissional) + (d.registro ? " (" + esc(d.registro) + ")" : "") : "") + "</p></div>" +
      TITULOS.filter((k) => (d.secoes[k[0]] || "").trim()).map((k) => '<div class="cartao"><h2>' + esc(k[1]) + "</h2>" + bloco(d.secoes[k[0]]) + "</div>").join("") +
      '<p style="text-align:center"><button class="imprimir" onclick="window.print()">Imprimir ou salvar em PDF</button></p><p class="aviso">Documento sigiloso, enviado pelo(a) profissional responsável. Em caso de dúvida, converse com ele(a).</p>';
  } catch (e) { document.getElementById("principal").innerHTML = '<div class="cartao"><h1>Não foi possível abrir</h1><p>' + esc(e.message) + "</p><p>Peça um novo link ao profissional.</p></div>"; }
}
if (TOKEN) carregar(); else document.getElementById("principal").innerHTML = '<div class="cartao"><h1>Link incompleto</h1><p>Peça o link ao profissional.</p></div>';
</script>
</body>
</html>

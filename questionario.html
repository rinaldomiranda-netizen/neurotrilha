<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14304F">
<title>NeuroTrilha — Questionário</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 96 96' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='96' height='96' rx='26' fill='%232563A8'/%3E%3Ccircle cx='22' cy='74' r='4' fill='%23fff' opacity='.55'/%3E%3Ccircle cx='34' cy='66' r='5' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='44' cy='55' r='6' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='50' cy='42' r='7' fill='%23fff'/%3E%3Cpath d='M72 14 L76.7 24.2 L87.8 25.4 L79.5 32.9 L81.8 43.8 L72 38.2 L62.2 43.8 L64.5 32.9 L56.2 25.4 L67.3 24.2 Z' fill='%23F6C453'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:17px/1.45 "Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif;color:#172438;background:#F4F7FB;min-height:100vh}
.topo{background:#14304F;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.topo i{width:38px;height:38px;display:block;font-style:normal}.topo i svg{width:100%;height:100%;display:block}.topo b{font-family:Nunito,sans-serif;font-weight:900;font-size:18px}
main{max-width:760px;margin:auto;padding:16px}
.cartao{background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(20,48,79,.08);padding:16px;margin-bottom:12px}
.item p{margin:0 0 10px;font-weight:650}.item small{color:#6b7b90;font-weight:700}
.escala{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.escala button{border:1px solid #d6e1ee;background:#f7faff;border-radius:12px;padding:10px 4px;font:inherit;font-size:13px;font-weight:700;color:#24558e;cursor:pointer}
.escala button.on{background:#2563A8;color:#fff;border-color:#2563A8}
.barra{position:sticky;top:0;background:#fffffff0;padding:10px 0;z-index:3}.barra div{height:8px;border-radius:99px;background:#e3ebf5;overflow:hidden}.barra span{display:block;height:100%;background:#2563A8;width:0}
.enviar{width:100%;border:0;border-radius:999px;padding:16px;font:inherit;font-weight:800;font-size:19px;color:#fff;background:#2563A8}
.enviar:disabled{opacity:.5}.erro{color:#b42318;font-weight:700}.ok{text-align:center;padding:40px 16px}.ok div{font-size:64px}
label.campo{display:block;margin:10px 0}label.campo input{width:100%;padding:11px;border:1px solid #cbd6e3;border-radius:10px;font:inherit}
@media(max-width:480px){.escala{grid-template-columns:1fr 1fr!important}}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icones/icone-apple-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</head>
<body>
<div class="topo"><i><svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="26" fill="#2563A8"/><circle cx="22" cy="74" r="4" fill="#fff" opacity=".55"/><circle cx="34" cy="66" r="5" fill="#fff" opacity=".7"/><circle cx="44" cy="55" r="6" fill="#fff" opacity=".85"/><circle cx="50" cy="42" r="7" fill="#fff"/><path d="M72 14 L76.7 24.2 L87.8 25.4 L79.5 32.9 L81.8 43.8 L72 38.2 L62.2 43.8 L64.5 32.9 L56.2 25.4 L67.3 24.2 Z" fill="#F6C453"/></svg></i><div><b>NeuroTrilha</b><br><small>Questionário</small></div></div>
<main id="principal"><div class="cartao">Carregando…</div></main>
<script src="config.js"></script>
<script src="questionario.js"></script>
<script>
"use strict";
const Q = window.NeuroTrilhaQuestionario;
const API = (window.NT_CONFIG && window.NT_CONFIG.FUNCOES) || "";
const TOKEN = (new URLSearchParams(location.search).get("q") || "").replace(/[^A-Za-z0-9_-]/g, "");
const $ = (id) => document.getElementById(id);
let resp = [], I = null;
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
async function carregar() {
  try {
    const r = await fetch(API + "/api/q/" + TOKEN, { cache: "no-store" }), d = await r.json();
    if (!r.ok) throw new Error(d.error || "Link inválido.");
    if (d.respondido) { $("principal").innerHTML = '<div class="cartao ok"><div>✅</div><h2>Questionário já respondido</h2><p>Obrigado! As respostas já foram enviadas ao profissional.</p></div>'; return; }
    I = Q.INSTRUMENTOS[d.instrumento] || Q.INSTRUMENTOS.snap; resp = new Array(I.itens.length).fill(null);
    document.querySelector(".topo small").textContent = I.titulo;
    const proprio = d.respondente === "proprio";
    $("principal").innerHTML =
      '<div class="cartao"><h2 style="margin-top:0">' + (proprio ? "Olá, " + esc(d.nome) + "!" : "Sobre " + esc(d.nome)) + "</h2><p>Este questionário foi pedido pelo(a) profissional <b>" + esc(d.profissional) + "</b>. " +
      (proprio || I !== Q.INSTRUMENTOS.snap ? esc(I.intro) : "Pense no comportamento de " + esc(d.nome) + " <b>nos últimos 6 meses</b> e marque o quanto cada frase descreve " + (d.respondente === "professor" ? "o que você observa na escola" : "o que você observa em casa") + ".") + " Não há resposta certa ou errada.</p>" +
      '' + (proprio ? '<input id="q-nome" type="hidden" value="">' : '<label class="campo">Seu nome (opcional)<input id="q-nome" maxlength="80"></label>') + '<p style="font-size:13px;color:#6b7b90">As respostas vão só para o profissional que pediu e ficam guardadas com segurança (LGPD).</p></div>' +
      '<div class="barra"><div><span id="q-prog"></span></div></div>' +
      I.itens.map((txt, i) => '<div class="cartao item"><small>' + (i + 1) + " de " + I.itens.length + "</small><p>" + esc(txt) + '</p><div class="escala" style="grid-template-columns:repeat(' + Q.opcoesDoItem(I, i).length + ',1fr)">' + Q.opcoesDoItem(I, i).map((o, k) => '<button type="button" data-i="' + i + '" data-v="' + k + '">' + o + "</button>").join("") + "</div></div>").join("") +
      '<p class="erro" id="q-erro"></p><button class="enviar" id="q-enviar" disabled>Enviar respostas</button>';
    document.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => {
      const i = Number(b.dataset.i); resp[i] = Number(b.dataset.v);
      document.querySelectorAll('[data-i="' + i + '"]').forEach((x) => x.classList.toggle("on", x === b));
      const feitos = resp.filter((x) => x !== null).length; $("q-prog").style.width = (100 * feitos / resp.length) + "%"; $("q-enviar").disabled = feitos < resp.length;
    }));
    $("q-enviar").addEventListener("click", enviar);
  } catch (e) { $("principal").innerHTML = '<div class="cartao"><h2>Não foi possível abrir</h2><p class="erro">' + esc(e.message) + "</p><p>Peça um link novo ao profissional.</p></div>"; }
}
async function enviar() {
  $("q-enviar").disabled = true; $("q-erro").textContent = "";
  try {
    const r = await fetch(API + "/api/q/" + TOKEN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ respostas: resp, nome: $("q-nome").value.trim() }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "Falha ao enviar.");
    $("principal").innerHTML = '<div class="cartao ok"><div>💙</div><h2>Obrigado!</h2><p>As respostas foram enviadas ao profissional. Pode fechar esta página.</p>' +
      (I === Q.INSTRUMENTOS.phq9 && resp[8] > 0 ? '<p style="background:#fff4e5;border-radius:12px;padding:12px;text-align:left"><b>Se você está passando por um momento difícil, não fique sozinho(a).</b> Converse com alguém de confiança e com o profissional. O <b>CVV</b> atende 24 horas, de graça, pelo telefone <b>188</b> ou em cvv.org.br. Em emergência, ligue <b>192</b> (SAMU).</p>' : "") + "</div>"; window.scrollTo(0, 0);
  } catch (e) { $("q-erro").textContent = e.message; $("q-enviar").disabled = false; }
}
if (TOKEN) carregar(); else $("principal").innerHTML = '<div class="cartao"><h2>Link incompleto</h2><p>Peça o link ao profissional.</p></div>';
</script>
</body>
</html>
